services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=development
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - BACKEND_URL=http://backend:5001
      - FLASK_ENV=development
    depends_on:
      - backend
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
